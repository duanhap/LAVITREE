name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Build & Deploy on EC2
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment (.env)
        env:
          ENV_PROD: ${{ secrets.ENV_PRODUCTION }}
        run: |
          if [ -n "$ENV_PROD" ]; then
            printf "%s\n" "$ENV_PROD" > .env
            echo "✅ Loaded .env successfully from GitHub Secret ENV_PRODUCTION"
          elif [ -f /home/ubuntu/.env.backup ] && [ ! -f .env ]; then
            cp /home/ubuntu/.env.backup .env
            echo "⚠️ Fallback: Copied .env from /home/ubuntu/.env.backup"
          else
            echo "ℹ️ Using existing .env on EC2 host"
          fi

      - name: Deploy Docker Containers
        run: |
          echo "🚀 Starting automated deployment on AWS EC2..."
          
          # Pull base images and build services
          docker compose pull minio postgres || true
          docker compose build core-api web-portal ai-service
          docker compose up -d --remove-orphans
          
          # Clean up dangling docker images to protect EC2 disk
          docker image prune -f
          
          echo "✅ Deployment finished successfully!"
