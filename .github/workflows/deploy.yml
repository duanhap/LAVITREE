name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Build & Deploy on EC2
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment (.env)
        env:
          ENV_PROD: ${{ secrets.ENV_PRODUCTION }}
        run: |
          if [ -n "$ENV_PROD" ]; then
            printf "%s\n" "$ENV_PROD" > .env
            echo "✅ Loaded .env successfully from GitHub Secret ENV_PRODUCTION"
          elif [ -f /home/ubuntu/.env.backup ] && [ ! -f .env ]; then
            cp /home/ubuntu/.env.backup .env
            echo "⚠️ Fallback: Copied .env from /home/ubuntu/.env.backup"
          else
            echo "ℹ️ Using existing .env on EC2 host"
          fi

      - name: Deploy Docker Containers
        run: |
          echo "🚀 Starting automated deployment on AWS EC2..."
          
          # Pull base images and build services
          docker compose pull minio postgres || true
          docker compose build core-api web-portal ai-service agent-service
          docker compose up -d --force-recreate --remove-orphans

          # BUG-48: chờ Core API sống và kết nối được CSDL; không được thì báo lỗi kèm log thay vì báo thành công
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5000/health > /dev/null; then
              echo "✅ Core API /health OK"
              break
            fi
            if [ "$i" -eq 45 ]; then
              echo "❌ Core API không lên sau 90 giây. Log gần nhất:"
              docker compose logs --tail 80 core-api
              exit 1
            fi
            sleep 2
          done
          
          # Clean up dangling docker images to protect EC2 disk
          docker image prune -f
          
          echo "✅ Deployment finished successfully!"
