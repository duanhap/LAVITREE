version: '3.8'

services:
  # 1. AI Vision Microservice (FastAPI + PyTorch ResNet-18 + Grad-CAM)
  ai-service:
    build:
      context: ./backend/ai-service
      dockerfile: Dockerfile
    container_name: lavitree-ai-service
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"

  # 2. Agri-Agent Service (Bonus: FastAPI + RAG Tư vấn khuyến nông)
  agent-service:
    build:
      context: ./backend/agent-service
      dockerfile: Dockerfile
    container_name: lavitree-agent-service
    restart: always
    ports:
      - "127.0.0.1:8001:8001"

  # 3. Core Business API (ASP.NET Core 8 Web API - Clean Architecture)
  core-api:
    build:
      context: ./backend/core-api
      dockerfile: Dockerfile
    container_name: lavitree-core-api
    restart: always
    ports:
      - "5000:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${SUPABASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=lavitree;Username=postgres;Password=postgrespassword123;}
      - AiService__BaseUrl=http://ai-service:8000
      - AgentService__BaseUrl=http://agent-service:8001
      - Minio__Endpoint=minio:9000
      - Minio__PublicUrl=${MINIO_PUBLIC_URL:-http://localhost:9000}
      - Minio__AccessKey=${MINIO_ACCESS_KEY:-minioadmin}
      - Minio__SecretKey=${MINIO_SECRET_KEY}
      - Minio__BucketName=${MINIO_BUCKET_NAME:-lavitree-diagnoses}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
    depends_on:
      - postgres
      - ai-service
      - minio

  # 4. Web Frontend Portal & Admin Dashboard (React Vite)
  web-portal:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: lavitree-web-portal
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - core-api

  # 5. Database: PostgreSQL 15 Container (100% Offline Ready)
  postgres:
    image: postgres:15-alpine
    container_name: lavitree-postgres
    restart: always
    environment:
      POSTGRES_DB: lavitree
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 6. Object Storage (Silo S3-Compatible MinIO Drop-in - Public & Open Source)
  minio:
    image: pgsty/silo:latest
    container_name: lavitree-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"              # S3 API cho Core API & Client truy cập tải ảnh
      - "127.0.0.1:9001:9001"    # Web Dashboard quản trị xem ảnh (chỉ bind localhost bảo mật)
    volumes:
      - minio_data:/data


volumes:
  postgres_data:
  minio_data:


