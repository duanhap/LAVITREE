# Rate limit zone for AI Chat to prevent Gemini quota exhaustion (Denial of Wallet)
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=10r/m;
# BUG-42: chặn dò mật khẩu / tạo tài khoản hàng loạt ngay ở cửa ngoài (Core còn một lớp 10 lần/phút nữa)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
# BUG-42: trần chung cho mọi API của Core, đủ rộng cho trang Admin gọi nhiều API cùng lúc
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# Vượt giới hạn trả 429 (Too Many Requests) thay vì 503 để web hiện đúng thông báo
limit_req_status 429;

# BUG-110: trên máy chủ, nginx Ubuntu (HTTPS) chuyển request vào container này qua 127.0.0.1:3000,
# nên $remote_addr luôn là IP nội bộ Docker và MỌI người dùng chung một giới hạn (đăng nhập, chat, lượt khách).
# Chỉ khi request đến từ mạng nội bộ / Docker mới lấy IP thật trong X-Forwarded-For (lấy địa chỉ
# không tin cậy cuối cùng, nên client tự thêm X-Forwarded-For giả cũng không đổi được IP của mình).
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    # BUG-46: image nginx-unprivileged không được mở cổng < 1024
    listen 8080;
    server_name localhost;

    # BUG-42: mặc định chỉ nhận request tối đa 2 MB (JSON lớn nhất là nhập 300 chất cấm / bài tri thức 50.000 ký tự).
    # Chỉ 3 đường dẫn tải tệp bên dưới mới được 15 MB (Core tự giới hạn tệp 10 MB, cộng phần đóng gói multipart).
    client_max_body_size 2M;

    # BUG-41: header bảo mật cho mọi phản hồi (HTTPS do nginx trên máy chủ Ubuntu đảm nhận)
    # - nosniff: trình duyệt không tự đoán kiểu file (chặn biến ảnh tải lên thành script)
    # - frame-ancestors / X-Frame-Options: không cho trang khác nhúng Lavitree vào iframe (clickjacking)
    # - CSP: chỉ chạy script của chính Lavitree; ảnh sản phẩm / tri thức được lấy từ mọi nguồn https
    # - HSTS: trình duyệt nhớ chỉ vào bằng HTTPS (bỏ qua khi chạy http ở máy dev)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # BUG-37: file tĩnh không tồn tại phải trả 404, không trả trang index.html với mã 200
    # (trước đây ảnh thuốc /images/products/*.png "có vẻ tồn tại" nhưng thực ra là HTML, hiện ảnh vỡ;
    # file JS cũ sau khi deploy cũng nhận HTML và báo lỗi MIME khó hiểu).
    location ^~ /images/ {
        try_files $uri =404;
    }
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # Reverse proxy CHỈ mở endpoint chat và chuyển giọng nói TTS cho AI Agent (kèm Rate Limit & Streaming SSE)
    location = /api/v1/agent/chat {
        limit_req zone=chat_limit burst=5 nodelay;
        proxy_pass http://agent-service:8001/api/v1/agent/chat;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # BUG-90: xóa header chỉ Core API được gửi qua mạng nội bộ, trình duyệt không được tự đặt
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-Internal-Key "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Endpoint chuyển văn bản thành giọng nói AI Neural TTS (MP3)
    location = /api/v1/agent/tts {
        limit_req zone=chat_limit burst=5 nodelay;
        proxy_pass http://agent-service:8001/api/v1/agent/tts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_read_timeout 60s;
    }

    # Bảo mật: Chặn toàn bộ các endpoint nhạy cảm khác của agent-service (như /trace, /internal/*)
    # Tuyệt đối không cho phép truy cập vết thực thi hoặc trigger reindex từ Internet
    location ^~ /api/v1/agent/ {
        return 404;
    }

    # BUG-42: đăng nhập / đăng ký: 10 lần/phút mỗi IP (cho phép dồn 5 lần), vượt quá trả 429
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=auth_limit burst=5 nodelay;
        include /etc/nginx/snippets/core-proxy.conf;
    }

    # BUG-42: chỉ các đường dẫn tải tệp mới được gửi tới 15 MB
    # (ảnh khám bệnh, ảnh tri thức của Admin, PDF danh mục chất cấm)
    location ~ ^/api/v1/(diagnose|knowledge/images|banned-substances/parse-pdf)$ {
        client_max_body_size 15M;
        limit_req zone=api_limit burst=40 nodelay;
        include /etc/nginx/snippets/core-proxy.conf;
    }

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        include /etc/nginx/snippets/core-proxy.conf;
    }

    # Reverse proxy MinIO uploaded images (original & Grad-CAM heatmap)
    location /lavitree-diagnoses/ {
        # BUG-42: Internet chỉ được XEM ảnh (GET, kèm HEAD); không cho PUT / DELETE / POST tới MinIO
        limit_except GET {
            deny all;
        }
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
