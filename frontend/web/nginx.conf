# Rate limit zone for AI Chat to prevent Gemini quota exhaustion (Denial of Wallet)
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=10r/m;

server {
    listen 80;
    server_name localhost;

    # Client upload limit for high-resolution leaf images
    client_max_body_size 15M;

    # BUG-41: header bảo mật cho mọi phản hồi (HTTPS do nginx trên máy chủ Ubuntu đảm nhận)
    # - nosniff: trình duyệt không tự đoán kiểu file (chặn biến ảnh tải lên thành script)
    # - frame-ancestors / X-Frame-Options: không cho trang khác nhúng Lavitree vào iframe (clickjacking)
    # - CSP: chỉ chạy script của chính Lavitree; ảnh sản phẩm / tri thức được lấy từ mọi nguồn https
    # - HSTS: trình duyệt nhớ chỉ vào bằng HTTPS (bỏ qua khi chạy http ở máy dev)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy CHỈ mở duy nhất endpoint chat cho AI Agent (kèm Rate Limit & Streaming SSE)
    location = /api/v1/agent/chat {
        limit_req zone=chat_limit burst=5 nodelay;
        proxy_pass http://agent-service:8001/api/v1/agent/chat;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # BUG-90: xóa header chỉ Core API được gửi qua mạng nội bộ, trình duyệt không được tự đặt
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-Internal-Key "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Bảo mật: Chặn toàn bộ các endpoint nhạy cảm khác của agent-service (như /trace, /internal/*)
    # Tuyệt đối không cho phép truy cập vết thực thi hoặc trigger reindex từ Internet
    location ^~ /api/v1/agent/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://core-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Overwrite X-Forwarded-For with the real connecting IP to prevent IP spoofing
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # BUG-90: Agent gọi Core trực tiếp trong mạng Docker, không qua nginx; khóa nội bộ từ Internet bị xóa
        proxy_set_header X-Internal-Key "";
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_cache_bypass $http_upgrade;
    }

    # Reverse proxy MinIO uploaded images (original & Grad-CAM heatmap)
    location /lavitree-diagnoses/ {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
