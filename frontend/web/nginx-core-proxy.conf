# Cấu hình chung khi chuyển request /api/ sang Core API (được include trong nginx.conf).
# Gom một chỗ để các location /api/ (thường, đăng nhập, tải tệp) không bị sót header bảo mật.
proxy_pass http://core-api:8080;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection 'upgrade';
proxy_set_header Host $host;
# Ghi đè X-Forwarded-For bằng IP thật (đã qua realip) để client không tự khai IP giả
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# BUG-90: Agent gọi Core trực tiếp trong mạng Docker, không qua nginx; khóa nội bộ từ Internet bị xóa
proxy_set_header X-Internal-Key "";
proxy_set_header X-User-Id "";
proxy_set_header X-User-Role "";
proxy_cache_bypass $http_upgrade;
